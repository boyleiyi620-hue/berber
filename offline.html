<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <title>Çevrim dışısın — Berber Studio</title>
  <style>
    :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1e9;color:#20221d}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);padding:28px;border:1px solid #e2dfd4;border-radius:22px;background:#fffdf8;text-align:center;box-shadow:0 16px 40px #20221d12}
    .mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 20px;border-radius:18px;background:#26372d;color:#f4f1e9;font-size:26px}
    h1{margin:0;font-size:24px;letter-spacing:-.04em}p{margin:12px 0 22px;color:#71766f;font-size:14px;line-height:1.6}
    a{display:inline-block;padding:12px 18px;border-radius:12px;background:#26372d;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✂</div>
    <h1>Bağlantı yok</h1>
    <p>Bu sayfa şu anda çevrim dışı. İnternete bağlandığında yeniden deneyebilirsin.</p>
    <a href="./">Randevu sayfasına dön</a>
  </main>
</body>
</html>
